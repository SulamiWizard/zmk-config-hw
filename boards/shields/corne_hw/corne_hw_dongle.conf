# Split central: connects to the computer over USB (or BT profiles).

# USB powered, so never sleep
CONFIG_ZMK_SLEEP=n

# ZMK Studio (built with the studio-rpc-usb-uart snippet)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Fetch both halves' battery levels and report them to the computer
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
