# Board settings for the Makerdiary nRF52840 MDK USB Dongle (applies to both the
# dongle firmware and its settings_reset). Unlike nice_nano//zmk, the upstream
# Zephyr board doesn't enable ZMK's BLE/USB or flash-backed settings, so mirror
# what ZMK's own nrf52840dongle//zmk board turns on.

# Its UF2 bootloader loads apps at 0x1000 (where Zephyr links them) with the
# standard nRF52840 family ID, so we only need the .uf2 output.
CONFIG_BUILD_OUTPUT_UF2=y

CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# HID Transports
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# Settings options (store pairings in flash)
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
